name: Auto-merge develop to main

on:
  push:
    branches:
      - develop

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for conflicts
        id: check-conflicts
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git fetch origin main develop
          git checkout main

          if git merge --no-commit --no-ff origin/develop; then
            git merge --abort
            echo "status=no_conflicts" >> "$GITHUB_OUTPUT"
            echo "No conflicts detected between develop and main"
          else
            git merge --abort || true
            echo "status=has_conflicts" >> "$GITHUB_OUTPUT"
            echo "Conflicts detected while merging develop into main"
          fi

      - name: Merge develop to main
        if: steps.check-conflicts.outputs.status == 'no_conflicts'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git checkout main
          git merge origin/develop --no-edit
          git push origin main
          
          echo "Successfully merged develop to main"

      - name: Open pull request when conflicts exist
        if: steps.check-conflicts.outputs.status == 'has_conflicts'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:develop`;
            const base = 'main';
            const title = 'Resolve conflicts between develop and main';
            const body = `Automatic merge from develop to main failed in workflow run ${context.runId}. Please resolve the conflicts and merge manually.`;

            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              head,
              base,
              state: 'open'
            });

            if (existing.length) {
              core.info(`Open PR already exists (#${existing[0].number}).`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              head: 'develop',
              base,
              title,
              body
            });

            core.info(`Created PR #${pr.data.number}`);

      - name: Fail workflow due to conflicts
        if: steps.check-conflicts.outputs.status == 'has_conflicts'
        run: |
          echo "Workflow failed because conflicts were detected between develop and main. A pull request has been opened (or reused) for manual resolution."
          exit 1
